name: OmegA-FCA CI

concurrency:
  group: omega-fca-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, public-package]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: npm run test:syntax
