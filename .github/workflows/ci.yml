name: OmegA-FCA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node --check index.js
      - run: node --check src/api/client.js
      - run: node --check src/compat/goatbotLogin.js
      - run: node --check src/runtime/connection.js
      - run: node --check src/events/dispatcher.js
      - run: node --check src/security/cookies.js
      - run: node --check src/security/redact.js
      - run: node --check src/security/sessionCrypto.js
      - run: node --check src/security/sessionStore.js
      - run: node --check src/license/verify.js
      - run: node --check src/license/provider.js
