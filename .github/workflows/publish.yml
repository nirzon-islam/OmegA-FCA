name: Publish OmegA-FCA to GitHub Packages

on:
  push:
    branches: [public-package]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/publish.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@octopusworldpro-web'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: |
          npm test
          npm run test:syntax
      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
